<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="apple-touch-icon" href="https://img.icons8.com/isometric/512/document.png">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>快捷文本生成器</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #f5f6f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 420px; background: #ffffff; min-height: 100vh; padding: 20px 24px; display: flex; flex-direction: column; align-items: center; }
        .title { font-size: 18px; font-weight: 600; color: #1a1a1a; margin: 10px 0 24px; }
        .label { font-size: 14px; color: #666; align-self: flex-start; margin-bottom: 12px; }
        .input-box { width: 100%; height: 150px; border: 1px solid #e0e0e0; border-radius: 12px; padding: 14px; font-size: 14px; outline: none; background-color: #fafafa; margin-bottom: 24px; resize: none; }
        .input-box:focus { border-color: #07c160; }
        .button-list { width: 100%; display: flex; flex-direction: column; gap: 12px; }
        .btn { width: 100%; padding: 14px 0; border-radius: 8px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; }
        .btn-secondary { background-color: #ebebeb; color: #1e7041; }
        /* 清除按钮专属样式 */
        .btn-clear { background-color: #f0f0f0; color: #888888; border: 1px dashed #cccccc; margin-top: 8px; }
        .btn-clear:active { background-color: #e5e5e5; }
        .toast { position: fixed; bottom: 40px; background-color: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; }
    </style>

<div class="container">
    <div class="title">快捷文本生成器</div>
    <div class="label">请输入你的原始内容：</div>
    <textarea class="input-box" id="userInput" placeholder="在此输入需要处理的文字..."></textarea>
    <div class="label" style="text-align: center; width: 100%;">点击按钮生成并复制：</div>
    <div class="button-list">
        <button class="btn btn-secondary" onclick="handleGenerate('你是一名拥有20年以上经验的北美制造业和维修业是质量工程师，熟悉质量管理（QA/QC）、制造业、工程、供应链及项目管理领域的商务沟通。\n请根据我提供的内容进行专业改写，并遵循以下要求：\n总体要求\n使用自然、专业、礼貌的北美商务英语。\n保留原意，不添加任何未经提供的信息。\n表达准确、有逻辑。避免中式英语，采用英语母语人士常用表达。\n适合发送给 Manager、Director、Customer、Engineer、Production Supervisor 等商务对象。\n根据上下文自动调整正式程度，但始终保持Professional、Polite、Respectful。\n写作原则\n使用积极、客观、中性的表达方式。\n多描述事实，少表达个人情绪。\n避免生硬直译。\n避免重复用词。\n\n下面是需要改写的内容')">商务英文邮件</button>
        <button class="btn btn-secondary" onclick="handleGenerate('给上级的邮件')">给上级的邮件</button>
        <button class="btn btn-secondary" onclick="handleGenerate('修改语法和拼写错误')">修改语法和拼写错误</button>
        <button class="btn btn-secondary" onclick="handleGenerate('请将下面的内容改写成适合英语口头演讲（Presentation）的风格，并完成以下要求：\n1. 保持原意\n不改变原文的内容和事实。\n保留所有重要的数据、结论和逻辑。\n2. 改写成演讲风格\n使用自然、流畅、易于表达的口语化句式，而不是书面报告。语言专业但不过于正式，让听众容易理解。将长句拆分成短句，方便现场讲话。\n3. 翻译成自然的英文\n使用符合北美商务和工程领域的表达方式。听起来像一位质量工程师或项目工程师在会议上的汇报。避免逐字直译，优先使用英语母语者常用表达。\n4. 输出格式\nEnglish Presentation Script\n（自然、专业、适合口头汇报的英文）\n\n请按上面提示词处理下面内容：')">口语化翻译</button>
        <button class="btn btn-secondary" onclick="handleGenerate('请把我下面提供的中文内容改写成自然、简单、地道的英文口语，主要用于日常交流，比如打电话、去商店、和工作人员沟通、询问事情等。\n要求：\n1. 使用简单、常用的英文单词和短语，像普通人在日常生活中说话一样。\n2. 尽量避免复杂、正式、生僻的词汇。\n3. 句子不要太长，要简短、清楚、容易说出口。\n4. 不要逐字翻译中文，要根据英文的日常表达习惯重新组织句子。\n5. 如果有更自然、更常见的说法，请优先使用自然的口语表达。\n6. 语气要礼貌、友好，但不要太正式。\n7. 根据提供的内容，如果是打电话使用，可以让表达听起来像真实的电话对话。\n8. 如果一句话有多种常见说法，给我一个最推荐、最自然的版本即可。\n9. 英文下面可以简单写一句中文意思，帮助我确认意思，但不要长篇解释。\n10. 最终英文要让我能够直接拿来开口说。\n我的中文内容是')">日常口语</button>
        <button class="btn btn-secondary" onclick="handleGenerate('你是一名精通中国传统命理学的资深命理师，擅长四柱八字和紫微斗数。现在请根据我的出生资料，结合：① 八字原局 ② 大运 ③ 流年 ④ 流月 ⑤ 紫微斗数本命盘 ⑥ 紫微斗数大限 ⑦ 紫微斗数流年 ⑧ 紫微斗数流月，对我本月的整体运势进行综合推算。本次分析的目的，是在每个月月初，对接下来一个月进行一次月运预测。请不要只分别讲八字和紫微斗数，而要在最后进行交叉验证，找出两个体系共同指向的重点。 一、我的出生资料 请根据以下资料进行排盘： 性别：【填写】 出生日期：【填写公历年月日】 出生时间：【填写具体时间，例如 14:30】 出生地点：【填写城市、国家】 当前居住地：【填写城市、国家】 本次预测月份：【填写，例如 2027年3月】 如果出生日期是农历，请明确注明“农历”。如果出生时间涉及： 时区 夏令时 真太阳时 出生地经度 请先判断是否需要校正，并说明最终采用的时间。如果资料不足以准确排盘，请先指出缺少的信息，不要自行猜测。 二、首先确定本月的时间信息 请明确列出： 本月公历时间范围 本月农历时间范围 本月干支 本月所属节气 本月对应的八字流月 特别注意：八字流月通常以节气作为月份划分依据，而不是简单按照公历1号到月底划分。请根据实际节气确定本次流月，而不要机械地按照公历月份判断。三、第一部分：八字流月分析 请结合：原命局 + 大运 + 流年 + 流月 分析本月运势。重点观察： 日主旺衰 五行生克 十神变化 喜用神 忌神 天干关系 地支关系 合 冲 刑 害 破 三合 三会 六合 流年与流月之间的关系 流月与原命局之间的关系 流月与大运之间的关系 不要只看到某一个吉星或凶星就下结论，要综合判断。四、第二部分：本月事业运 从八字角度分析： 工作整体趋势 工作压力 工作机会 升职机会 加薪机会 换工作机会 是否适合主动争取机会 是否适合保持稳定 与领导关系 与同事关系 贵人 小人 工作中容易发生的问题 请最后给出：本月事业运：★★★★★ 并解释评分依据。五、第三部分：本月财运 分析： 正财 偏财 收入 奖金 额外收入 投资机会 大额支出 破财风险 守财能力 是否适合进行重大财务决定 特别区分：“赚钱机会”与“能够真正留住钱”不是同一回事。不要因为出现财星，就简单判断为“发财”。最后给出：本月财运：★★★★★ 六、第四部分：本月感情与人际关系 分析： 有伴侣者的关系 夫妻关系 异性缘 人际关系 贵人 小人 容易发生争执的情况 是否适合认识新朋友 是否适合主动沟通 最后给出：本月感情运：★★★★★ 本月人际运：★★★★★ 七、第五部分：本月家庭、居住和出行 分析： 家庭关系 父母 家庭事务 房屋 搬家 装修 出行 长途旅行 如果没有明显信号，请明确说明“本月没有明显变化信号”，不要为了凑内容而强行预测事件。八、第六部分：本月健康与精神状态 从传统八字五行角度分析： 精力 压力 情绪 睡眠 工作疲劳 身体状态容易出现的波动 只能作为传统命理角度的参考。不得把命理推断当成医学诊断。如果出现健康问题，应建议咨询专业医生。九、第七部分：紫微斗数流月分析 在八字分析完成以后，再使用紫微斗数分析本月。请重点分析： 流月命宫 流月身宫 流月官禄宫 流月财帛宫 流月夫妻宫 流月迁移宫 流月福德宫 流月疾厄宫 流月田宅宫 结合：本命盘 + 大限 + 流年 + 流月 分析本月哪些人生领域最容易出现变化。 十、紫微斗数星曜与四化 重点观察本月相关宫位中的主要星曜，以及： 紫微 天府 武曲 天相 天梁 太阳 太阴 天机 巨门 天同 廉贞 贪狼 七杀 破军 以及：禄、权、科、忌 对本月事业、财运、感情、人际和家庭的影响。不要单独根据某一颗星判断吉凶，要结合宫位、星曜组合、大限和流年综合判断。 十一、八字与紫微斗数交叉验证 这是本次分析最重要的部分。请把两个体系的结论放在一起比较。例如：事业 八字：【分析结果】 紫微：【分析结果】 综合判断：【两者是否一致】 财运 八字：【分析结果】 紫微：【分析结果】 综合判断：【两者是否一致】 感情 八字：【分析结果】 紫微：【分析结果】 综合判断：【两者是否一致】 请特别找出：★★★ 两个体系共同指向的事情 例如： 两个体系都显示事业机会增加 两个体系都显示财运较好 两个体系都提示人际关系需要谨慎 两个体系都显示本月有变动 这些属于本月的重点信号。如果八字和紫微斗数出现不同结论，也必须明确指出，不要强行统一。十二、本月最重要的几个时间段 请尽可能进一步细分本月。如果理论条件允许，可以结合：流日 + 八字 + 紫微斗数 寻找本月：① 最有利的时间段 适合： 求职 谈工作 谈合作 赚钱 投资 处理重要事务 社交 做重大决定 ② 最需要谨慎的时间段 注意： 工作冲突 财务问题 人际矛盾 感情问题 出行 冲动决策 如果无法可靠精确到某一天，就只判断到“上旬 / 中旬 / 下旬”，不要虚构具体日期。十三、本月重点事件预测 综合八字和紫微斗数，预测本月最值得关注的：3～5件事情。每一项按照以下格式：事件1 可能发生的领域： 可能性：高 / 中 / 低 有利还是不利： 大致时间： 命理依据： 建议： 注意：不要把“可能”说成“必然”。如果没有明显事件信号，请明确说明。 十四、本月行动建议 根据命理分析，给出：本月最适合做的5件事 例如：1. 主动争取工作机会 2. 控制不必要支出 3. 加强某方面的人际关系 以及：本月最好避免的5件事 例如：1. 冲动投资 2. 与人发生正面冲突 3. 在情绪不稳定时做重大决定 建议必须尽量结合本月实际命理特点，而不是给出通用鸡汤。 十五、本月综合评分 请最后给出：| 项目 | 评分 | | ---- | ----- | | 综合运势 | ★★★★★ | | 事业 | ★★★★★ | | 财运 | ★★★★★ | | 感情 | ★★★★★ | | 人际 | ★★★★★ | | 家庭 | ★★★★★ | | 出行 | ★★★★★ | | 精神状态 | ★★★★★ | 然后明确回答：本月属于： 上升月 平稳月 调整月 谨慎月 转折月 并说明主要原因。十六、最终总结 最后只用几句话告诉我：本月最大的机会：【……】 本月最大的风险：【……】 本月最值得做的事情：【……】 本月最应该避免的事情：【……】 本月最重要的时间段：【……】 本月一句话总结：【……】 十七、分析原则 请严格遵守：1. 八字和紫微斗数必须结合分析。2. 不要只分别分析两个体系，然后简单总结。3. 必须进行交叉验证。4. 不确定的地方必须明确说明。5. 不要为了追求“神准”而编造具体事件。6. 不要使用过于笼统的套话。7. 如果两个体系结论不同，要明确指出。8. 不要把命理预测说成确定事实。9. 不要使用恐吓式语言。10. 不要因为出现一个吉星就直接判断“大吉”。11. 也不要因为出现一个凶星就直接判断“大凶”。12. 必须结合原局、大运、流年和流月综合判断。13. 流月应优先按照节气划分，而不是简单按照公历月份划分。14. 如果无法可靠判断到具体日期，就不要强行预测具体日期。15. 健康、投资、法律等问题只能作为传统命理参考，不能代替专业意见。请使用中文回答，并按照以下顺序输出：① 本月时间与流月确认 ② 八字流月分析 ③ 事业运 ④ 财运 ⑤ 感情与人际 ⑥ 家庭、居住与出行 ⑦ 健康与精神状态 ⑧ 紫微斗数流月分析 ⑨ 八字＋紫微交叉验证 ⑩ 本月重要时间段 ⑪ 本月重点事件 ⑫ 行动建议 ⑬ 综合评分 ⑭ 最终总结')">月运</button>

        <button class="btn btn-secondary" onclick="handleGenerate('你是一名拥有20年以上经验的质量工程师（Quality Engineer），熟悉ISO 9001、8D Report、RCCA、Failure mode analysis 、NCR、CAPA及维修行业质量报告。\n\n请将我提供的内容按照专业质量报告（Quality Report）的风格进行优化，并完成以下任务：\n\n要求：\n\n1. 保持原意，不得添加未经提供的事实或推测。\n2. 使用专业、客观、中性的质量报告语言，避免口语化表达。\n3. 描述逻辑清晰，突出事件经过、测试结果、检查发现及最终结论。\n4. 语言简练，适合填写质量报告表格。\n5. 如存在重复内容，请合并，使表达更加专业流畅。\n\n输出格式：\n1. Failure description \n2. Root Cause Analysis\n判断属于：\n-Operational Issue\n-Process Issue\n-Design Issue\n-Supplier Issue\n-Material Issue\n-Equipment Issue\n-Maintenance Issue\n-Unknown（Information Insufficient）\n简要说明判断依据。\n\n3. Mitigating Factors\n用1–3句话描述已采取的控制措施或风险降低措施。\n请直接按上述格式输出，不需要解释你的修改过程。\n下面是需要改写的内容')">Warranty Tracker</button>
        <button class="btn btn-secondary" onclick="handleGenerate('客户投诉')">客户投诉</button>
        <!-- 新增清除文本框内容的按钮 -->
        <button class="btn btn-secondary" onclick="clearInput()">清除文本框内容</button>
    </div>
</div>
<div class="toast" id="toast"></div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }

    async function handleGenerate(type) {
        const input = document.getElementById('userInput').value.trim();
        if (!input) return showToast('请先输入需要处理的文字');

        showToast('生成中...');
        
        setTimeout(async () => {
            const result = `${type}生成结果:\n${input}`;
            await navigator.clipboard.writeText(result);
            showToast(`${type}已生成并复制！`);
        }, 600);
    }

    // 清空文本框函数
    function clearInput() {
        const input = document.getElementById('userInput');
        if (!input.value.trim()) {
            showToast('文本框已经是空的了');
            return;
        }
        input.value = '';
        input.focus(); // 自动聚焦回输入框
        showToast('已清除内容');
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }
</script>
   <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));

    // handleGenerate 必须放在 index.html 的 script 里面！
    async function handleGenerate(type, customPrompt) {
        const input = document.getElementById('userInput').value.trim();
        if (!input) return showToast('请先输入需要处理的文字');

        showToast('生成中...');
        
        const promptHeader = customPrompt || `请将以下内容改写为${type}：`;

        setTimeout(async () => {
            const result = `${promptHeader}\n\n${input}`;
            await navigator.clipboard.writeText(result);
            showToast(`${type}已生成并复制！`);
        }, 600);
    }

    function clearInput() {
        const input = document.getElementById('userInput');
        if (!input.value.trim()) return showToast('文本框已经是空的了');
        input.value = '';
        input.focus();
        showToast('已清除内容');
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }
</script>
