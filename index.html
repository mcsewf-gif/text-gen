<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="apple-touch-icon" href="https://img.icons8.com/isometric/512/document.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#07c160">
    <link rel="manifest" href="manifest.json">
    <title>快捷文本生成器</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #f5f6f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 420px; background: #ffffff; min-height: 100vh; padding: 20px 24px; display: flex; flex-direction: column; align-items: center; }
        .title { font-size: 18px; font-weight: 600; color: #1a1a1a; margin: 10px 0 24px; }
        .label { font-size: 14px; color: #666; align-self: flex-start; margin-bottom: 12px; }
        .input-box { width: 100%; height: 150px; border: 1px solid #e0e0e0; border-radius: 12px; padding: 14px; font-size: 14px; outline: none; background-color: #fafafa; margin-bottom: 24px; resize: none; }
        .input-box:focus { border-color: #07c160; }
        .button-list { width: 100%; display: flex; flex-direction: column; gap: 12px; }
        .btn { width: 100%; padding: 14px 0; border-radius: 8px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; }
        .btn-secondary { background-color: #ebebeb; color: #1e7041; }
        /* 清除按钮专属样式 */
        .btn-clear { background-color: #f0f0f0; color: #888888; border: 1px dashed #cccccc; margin-top: 8px; }
        .btn-clear:active { background-color: #e5e5e5; }
        .toast { position: fixed; bottom: 40px; background-color: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
<div class="container">
    <div class="title">快捷文本生成器</div>
    <div class="label">请输入你的原始内容：</div>
    <textarea class="input-box" id="userInput" placeholder="在此输入需要处理的文字..."></textarea>
    <div class="label" style="text-align: center; width: 100%;">点击按钮生成并复制：</div>
    <div class="button-list">
        <button class="btn btn-secondary" onclick="handleGenerate('你是一名拥有20年以上经验的北美制造业和维修业是质量工程师，熟悉质量管理（QA/QC）、制造业、工程、供应链及项目管理领域的商务沟通。\n请根据我提供的内容进行专业改写，并遵循以下要求：\n总体要求\n使用自然、专业、礼貌的北美商务英语。\n保留原意，不添加任何未经提供的信息。\n表达准确、有逻辑。避免中式英语，采用英语母语人士常用表达。\n适合发送给 Manager、Director、Customer、Engineer、Production Supervisor 等商务对象。\n根据上下文自动调整正式程度，但始终保持Professional、Polite、Respectful。\n写作原则\n使用积极、客观、中性的表达方式。\n多描述事实，少表达个人情绪。\n避免生硬直译。\n避免重复用词。\n\n下面是需要改写的内容')">商务英文邮件</button>
        <button class="btn btn-secondary" onclick="handleGenerate('给上级的邮件')">给上级的邮件</button>
        <button class="btn btn-secondary" onclick="handleGenerate('修改语法和拼写错误')">修改语法和拼写错误</button>
        <button class="btn btn-secondary" onclick="handleGenerate('请将下面的内容改写成适合英语口头演讲（Presentation）的风格，并完成以下要求：\n1. 保持原意\n不改变原文的内容和事实。\n保留所有重要的数据、结论和逻辑。\n2. 改写成演讲风格\n使用自然、流畅、易于表达的口语化句式，而不是书面报告。语言专业但不过于正式，让听众容易理解。将长句拆分成短句，方便现场讲话。\n3. 翻译成自然的英文\n使用符合北美商务和工程领域的表达方式。听起来像一位质量工程师或项目工程师在会议上的汇报。避免逐字直译，优先使用英语母语者常用表达。\n4. 输出格式\nEnglish Presentation Script\n（自然、专业、适合口头汇报的英文）\n\n请按上面提示词处理下面内容：')">口语化翻译</button>
        <button class="btn btn-secondary" onclick="handleGenerate('请把我下面提供的中文内容改写成自然、简单、地道的英文口语，主要用于日常交流，比如打电话、去商店、和工作人员沟通、询问事情等。\n要求：\n1. 使用简单、常用的英文单词和短语，像普通人在日常生活中说话一样。\n2. 尽量避免复杂、正式、生僻的词汇。\n3. 句子不要太长，要简短、清楚、容易说出口。\n4. 不要逐字翻译中文，要根据英文的日常表达习惯重新组织句子。\n5. 如果有更自然、更常见的说法，请优先使用自然的口语表达。\n6. 语气要礼貌、友好，但不要太正式。\n7. 根据提供的内容，如果是打电话使用，可以让表达听起来像真实的电话对话。\n8. 如果一句话有多种常见说法，给我一个最推荐、最自然的版本即可。\n9. 英文下面可以简单写一句中文意思，帮助我确认意思，但不要长篇解释。\n10. 最终英文要让我能够直接拿来开口说。\n我的中文内容是')">日常口语</button>
        <button class="btn btn-secondary" onclick="handleGenerate('你是一名精通中国传统命理学的资深命理师，擅长四柱八字和紫微斗数。\n现在请根据我的出生资料，结合：\n① 八字原局\n② 大运\n③ 流年\n④ 流月\n⑤ 紫微斗数本命盘\n⑥ 紫微斗数大限\n⑦ 紫微斗数流年\n⑧ 紫微斗数流月\n对我本月的整体运势进行综合推算。\n本次分析的目的，是在每个月月初，对接下来一个月进行一次月运预测。\n请不要只分别讲八字和紫微斗数，而要在最后进行交叉验证，找出两个体系共同指向的重点。\n\n 一、我的出生资料\n请根据以下资料进行排盘：\n 性别：【填写】\n 出生日期：【填写公历年月日】\n 出生时间：【填写具体时间，例如 14:30】\n 出生地点：【填写城市、国家】\n 当前居住地：【填写城市、国家】\n 本次预测月份：【填写，例如 2027年3月】\n\n如果出生日期是农历，请明确注明“农历”。\n\n如果出生时间涉及：\n\n 时区\n 夏令时\n 真太阳时\n 出生地经度\n\n请先判断是否需要校正，并说明最终采用的时间。\n\n如果资料不足以准确排盘，请先指出缺少的信息，不要自行猜测。\n\n\n二、首先确定本月的时间信息\n\n请明确列出：\n\n 本月公历时间范围\n 本月农历时间范围\n 本月干支\n 本月所属节气\n 本月对应的八字流月\n\n特别注意：\n\n八字流月通常以节气作为月份划分依据，而不是简单按照公历1号到月底划分。\n\n请根据实际节气确定本次流月，而不要机械地按照公历月份判断。\n\n三、第一部分：八字流月分析\n\n请结合：\n\n原命局 + 大运 + 流年 + 流月\n\n分析本月运势。\n\n重点观察：\n\n 日主旺衰\n 五行生克\n 十神变化\n 喜用神\n 忌神\n 天干关系\n 地支关系\n 合\n 冲\n 刑\n 害\n 破\n 三合\n 三会\n 六合\n 流年与流月之间的关系\n 流月与原命局之间的关系\n 流月与大运之间的关系\n\n不要只看到某一个吉星或凶星就下结论，要综合判断。\n\n\n四、第二部分：本月事业运\n\n从八字角度分析：\n\n 工作整体趋势\n 工作压力\n 工作机会\n 升职机会\n 加薪机会\n 换工作机会\n 是否适合主动争取机会\n 是否适合保持稳定\n 与领导关系\n 与同事关系\n 贵人\n 小人\n 工作中容易发生的问题\n\n请最后给出：\n\n本月事业运：★★★★★\n\n并解释评分依据。\n\n五、第三部分：本月财运\n\n分析：\n\n 正财\n 偏财\n 收入\n 奖金\n 额外收入\n 投资机会\n 大额支出\n 破财风险\n 守财能力\n 是否适合进行重大财务决定\n\n特别区分：\n\n“赚钱机会”与“能够真正留住钱”不是同一回事。\n\n不要因为出现财星，就简单判断为“发财”。\n\n最后给出：\n\n本月财运：★★★★★\n\n六、第四部分：本月感情与人际关系\n\n分析：\n\n 有伴侣者的关系\n 夫妻关系\n 异性缘\n 人际关系\n 贵人\n 小人\n 容易发生争执的情况\n 是否适合认识新朋友\n 是否适合主动沟通\n\n最后给出：\n\n本月感情运：★★★★★\n本月人际运：★★★★★\n\n七、第五部分：本月家庭、居住和出行\n\n分析：\n\n 家庭关系\n 父母\n 家庭事务\n 房屋\n 搬家\n 装修\n 出行\n 长途旅行\n\n如果没有明显信号，请明确说明“本月没有明显变化信号”，不要为了凑内容而强行预测事件。\n\n八、第六部分：本月健康与精神状态\n\n从传统八字五行角度分析：\n\n 精力\n 压力\n 情绪\n 睡眠\n 工作疲劳\n 身体状态容易出现的波动\n\n只能作为传统命理角度的参考。\n\n不得把命理推断当成医学诊断。\n\n如果出现健康问题，应建议咨询专业医生。\n\n九、第七部分：紫微斗数流月分析\n\n在八字分析完成以后，再使用紫微斗数分析本月。\n\n请重点分析：\n\n 流月命宫\n 流月身宫\n 流月官禄宫\n 流月财帛宫\n 流月夫妻宫\n 流月迁移宫\n 流月福德宫\n 流月疾厄宫\n 流月田宅宫\n\n结合：\n\n本命盘 + 大限 + 流年 + 流月\n分析本月哪些人生领域最容易出现变化。\n\n 十、紫微斗数星曜与四化\n\n重点观察本月相关宫位中的主要星曜，以及：\n\n 紫微\n 天府\n 武曲\n 天相\n 天梁\n 太阳\n 太阴\n 天机\n 巨门\n 天同\n 廉贞\n 贪狼\n 七杀\n 破军\n\n以及：\n\n禄、权、科、忌\n\n对本月事业、财运、感情、人际和家庭的影响。\n\n不要单独根据某一颗星判断吉凶，要结合宫位、星曜组合、大限和流年综合判断。\n\n 十一、八字与紫微斗数交叉验证\n\n这是本次分析最重要的部分。\n\n请把两个体系的结论放在一起比较。\n\n例如：\n\n事业\n\n八字：\n【分析结果】\n\n紫微：\n【分析结果】\n\n综合判断：\n【两者是否一致】\n\n\n财运\n\n八字：\n【分析结果】\n\n紫微：\n【分析结果】\n\n综合判断：\n【两者是否一致】\n\n感情\n\n八字：\n【分析结果】\n\n紫微：\n【分析结果】\n\n综合判断：\n【两者是否一致】\n\n\n请特别找出：\n\n ★★★ 两个体系共同指向的事情\n\n例如：\n\n 两个体系都显示事业机会增加\n 两个体系都显示财运较好\n 两个体系都提示人际关系需要谨慎\n 两个体系都显示本月有变动\n\n这些属于本月的重点信号。\n\n如果八字和紫微斗数出现不同结论，也必须明确指出，不要强行统一。\n\n十二、本月最重要的几个时间段\n\n请尽可能进一步细分本月。\n\n如果理论条件允许，可以结合：\n\n流日 + 八字 + 紫微斗数\n\n寻找本月：\n\n ① 最有利的时间段\n\n适合：\n\n 求职\n 谈工作\n 谈合作\n 赚钱\n 投资\n 处理重要事务\n 社交\n 做重大决定\n\n② 最需要谨慎的时间段\n\n注意：\n\n 工作冲突\n 财务问题\n 人际矛盾\n 感情问题\n 出行\n 冲动决策\n\n如果无法可靠精确到某一天，就只判断到“上旬 / 中旬 / 下旬”，不要虚构具体日期。\n\n十三、本月重点事件预测\n\n综合八字和紫微斗数，预测本月最值得关注的：\n\n3～5件事情。\n每一项按照以下格式：\n\n 事件1\n\n 可能发生的领域：\n 可能性：高 / 中 / 低\n 有利还是不利：\n 大致时间：\n 命理依据：\n 建议：\n\n注意：\n\n不要把“可能”说成“必然”。\n\n如果没有明显事件信号，请明确说明。\n\n 十四、本月行动建议\n\n根据命理分析，给出：\n\n 本月最适合做的5件事\n\n例如：\n\n1. 主动争取工作机会\n2. 控制不必要支出\n3. 加强某方面的人际关系\n\n以及：\n\n本月最好避免的5件事\n\n例如：\n\n1. 冲动投资\n2. 与人发生正面冲突\n3. 在情绪不稳定时做重大决定\n\n建议必须尽量结合本月实际命理特点，而不是给出通用鸡汤。\n\n 十五、本月综合评分\n\n请最后给出：\n\n| 项目 | 评分 |\n| ---- | ----- |\n| 综合运势 | ★★★★★ |\n| 事业 | ★★★★★ |\n| 财运 | ★★★★★ |\n| 感情 | ★★★★★ |\n| 人际 | ★★★★★ |\n| 家庭 | ★★★★★ |\n| 出行 | ★★★★★ |\n| 精神状态 | ★★★★★ |\n\n然后明确回答：\n\n本月属于：\n 上升月\n 平稳月\n 调整月\n 谨慎月\n 转折月\n\n并说明主要原因。\n\n 十六、最终总结\n\n最后只用几句话告诉我：\n\n 本月最大的机会：\n\n【……】\n\n本月最大的风险：\n\n【……】\n\n本月最值得做的事情：\n\n【……】\n\n本月最应该避免的事情：\n\n【……】\n\n本月最重要的时间段：\n\n【……】\n\n本月一句话总结：\n\n【……】\n\n 十七、分析原则\n\n请严格遵守：\n\n\n1. 八字和紫微斗数必须结合分析。\n2. 不要只分别分析两个体系，然后简单总结。\n3. 必须进行交叉验证。\n4. 不确定的地方必须明确说明。\n5. 不要为了追求“神准”而编造具体事件。\n6. 不要使用过于笼统的套话。\n7. 如果两个体系结论不同，要明确指出。\n8. 不要把命理预测说成确定事实。\n9. 不要使用恐吓式语言。\n10. 不要因为出现一个吉星就直接判断“大吉”。\n11. 也不要因为出现一个凶星就直接判断“大凶”。\n12. 必须结合原局、大运、流年和流月综合判断。\n13. 流月应优先按照节气划分，而不是简单按照公历月份划分。\n14. 如果无法可靠判断到具体日期，就不要强行预测具体日期。\n15. 健康、投资、法律等问题只能作为传统命理参考，不能代替专业意见。\n\n\n请使用中文回答，并按照以下顺序输出：\n\n\n① 本月时间与流月确认\n② 八字流月分析\n③ 事业运\n④ 财运\n⑤ 感情与人际\n⑥ 家庭、居住与出行\n⑦ 健康与精神状态\n⑧ 紫微斗数流月分析\n⑨ 八字＋紫微交叉验证\n⑩ 本月重要时间段\n⑪ 本月重点事件\n⑫ 行动建议\n⑬ 综合评分\n⑭ 最终总结')">月运</button>
